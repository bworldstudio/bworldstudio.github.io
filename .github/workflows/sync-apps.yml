name: Sync Google Play Apps

on:
  schedule:
    # Runs weekly on Sunday at midnight to check for new apps/updates
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Optional Google Play Package ID to sync (leave blank to auto-sync all BWorld Studio apps)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run App Sync
        env:
          INPUT_PACKAGE_ID: ${{ github.event.inputs.package_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_PACKAGE_ID" ]; then
            node scripts/sync-apps.js "$INPUT_PACKAGE_ID"
          else
            node scripts/sync-apps.js
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ assets/images/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-sync apps from Google Play"
            git push
          fi
